<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1d0b10" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="description" content="Bubble Nostalgia, le jeu de Serge Belmont : éclatez les boules, dissipez le brouillard et révélez les photographies." />
    <title>Bubble Nostalgia – Serge Belmont</title>
  </head>
  <body>
    <div id="stage">
      <div id="game"></div>

      <header id="hud" class="hidden">
        <div class="hud-row">
          <div class="pill"><span class="lbl">Niveau</span><b id="hud-level">1</b></div>
          <div class="score"><span class="lbl">Score</span><b id="hud-score">0</b></div>
          <div class="pill shots" title="Tirs restants"><i class="orb"></i><b id="hud-shots">0</b></div>
          <button id="btn-sound" class="icon-btn" type="button" aria-label="Couper ou rétablir le son"></button>
          <button id="btn-restart" class="icon-btn" type="button" aria-label="Recommencer le niveau">
            <svg viewBox="0 0 24 24"><path d="M12 5a7 7 0 1 1-6.6 4.7" /><path d="M5 4v5.5h5.5" /></svg>
          </button>
          <button id="btn-map" class="icon-btn" type="button" aria-label="Retour à la carte des niveaux">
            <svg viewBox="0 0 24 24"><path d="M5 5h5v5H5z" /><path d="M14 5h5v5h-5z" /><path d="M5 14h5v5H5z" /><path d="M14 14h5v5h-5z" /></svg>
          </button>
        </div>
        <div class="reveal">
          <div class="reveal-bar">
            <div id="reveal-fill"></div>
            <div id="reveal-target"></div>
          </div>
          <span id="reveal-text"></span>
        </div>
      </header>

      <section id="overlay-start" class="overlay home">
        <div id="home-photo" class="home-photo"></div>
        <div id="home-bubbles" class="home-art home-bubbles" aria-hidden="true"></div>
        <div id="home-cannon" class="home-art home-cannon" aria-hidden="true"></div>
        <div class="start-card">
          <div class="home-top">
            <p class="artist">Serge Belmont</p>
            <h1>Bubble Nostalgia</h1>
          </div>
          <div class="home-bottom">
            <p class="tagline">Éclatez les boules, dissipez le brouillard<br />et révélez la photographie.</p>
            <button id="btn-play" class="btn primary" type="button">Jouer</button>
            <button id="btn-collection" class="btn sepia" type="button">
              Collection <span id="home-collection" class="count"></span>
            </button>
            <p id="home-progress" class="home-progress"></p>
            <p class="version">Version 0.4</p>
          </div>
        </div>
      </section>

      <section id="screen-collection" class="overlay collection hidden">
        <header class="map-head">
          <button id="btn-collection-home" class="icon-btn" type="button" aria-label="Retour à l'accueil">
            <svg viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5" /><path d="M6.5 10v9h11v-9" /></svg>
          </button>
          <h3>Collection</h3>
          <div class="pill"><b id="collection-count">0 / 0</b></div>
        </header>
        <div class="collection-progress"><div id="collection-fill"></div></div>
        <div id="collection-scroll">
          <p id="collection-hint" class="collection-hint"></p>
          <div id="collection-grid"></div>
        </div>
        <div id="photo-viewer" class="hidden" role="dialog" aria-label="Photographie">
          <img id="viewer-img" alt="" draggable="false" />
          <p id="viewer-caption"></p>
          <button id="btn-viewer-close" class="btn sepia" type="button">Fermer</button>
        </div>
      </section>

      <section id="screen-map" class="overlay map hidden">
        <header class="map-head">
          <button id="btn-map-home" class="icon-btn" type="button" aria-label="Retour à l'accueil">
            <svg viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5" /><path d="M6.5 10v9h11v-9" /></svg>
          </button>
          <h3>Niveaux</h3>
          <div class="pill"><span class="star-ico">★</span><b id="map-stars">0</b></div>
        </header>
        <div id="map-scroll">
          <div id="map-path"></div>
        </div>
      </section>

      <section id="overlay-end" class="overlay sheet hidden">
        <div class="end-card">
          <h3 id="end-title"></h3>
          <p id="end-sub"></p>
          <div id="end-stars" class="stars"><span>★</span><span>★</span><span>★</span></div>
          <div class="stats">
            <div><span class="lbl">Score</span><b id="end-score">0</b></div>
            <div><span class="lbl">Photo révélée</span><b id="end-percent">0 %</b></div>
            <div><span class="lbl">Tirs restants</span><b id="end-shots">0</b></div>
          </div>
          <p id="end-note" class="note"></p>
          <div class="actions">
            <button id="btn-end-map" class="btn secondary compact" type="button" aria-label="Carte des niveaux">Carte</button>
            <button id="btn-again" class="btn secondary" type="button">Rejouer</button>
            <button id="btn-next" class="btn primary" type="button">Niveau suivant</button>
          </div>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
